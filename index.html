<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Surat AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-blue-600 mb-2">📄 Asisten Surat AI</h1>
    <p class="text-sm text-gray-600 mb-6">Buat surat resmi rapi dan cepat dalam hitungan detik.</p>

    <!-- Form Kode Premium -->
    <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
      <label class="block text-xs font-semibold text-blue-800 uppercase mb-1">Kode Premium (Opsional)</label>
      <div class="flex gap-2">
        <input type="text" id="premiumCode" placeholder="Masukkan kode SURAT-..." class="flex-1 p-2 text-sm border rounded">
        <button onclick="simpanKode()" class="bg-blue-600 text-white px-4 py-2 text-sm rounded hover:bg-blue-700">Simpan</button>
      </div>
      <p id="codeStatus" class="text-xs text-blue-600 mt-1"></p>
    </div>

    <!-- Form Generator -->
    <div class="space-y-4">
      <div>
        <label class="block font-medium text-sm mb-1">Jenis Surat</label>
        <select id="jenisSurat" class="w-full p-2 border rounded">
          <option value="Surat Lamaran Kerja">Surat Lamaran Kerja</option>
          <option value="Surat Izin Tidak Masuk Kerja/Sekolah">Surat Izin Tidak Masuk</option>
          <option value="Surat Kuasa">Surat Kuasa</option>
          <option value="Surat Pengunduran Diri (Resign)">Surat Pengunduran Diri</option>
          <option value="Surat Keterangan Usaha (SKU) RT/RW">Surat Keterangan Usaha RT/RW</option>
          <option value="Surat Keberatan / Sanggahan">Surat Keberatan / Sanggahan</option>
          <option value="Surat Permohonan Magang">Surat Permohonan Magang</option>
        </select>
      </div>

      <div>
        <label class="block font-medium text-sm mb-1">Detail Informasi (Nama, Tujuan, Alasan, Tanggal, dll)</label>
        <textarea id="detailInput" rows="4" placeholder="Contoh: Nama saya Budi, melamar posisi Admin di PT Maju Bersama. Pengalaman 2 tahun di bidang akuntansi..." class="w-full p-2 border rounded"></textarea>
      </div>

      <button id="btnSubmit" onclick="generateSurat()" class="w-full bg-green-600 text-white py-2 font-bold rounded hover:bg-green-700">
        Buat Surat Sekarang
      </button>
    </div>

    <!-- Hasil -->
    <div id="resultArea" class="mt-8 hidden">
      <h2 class="font-bold text-lg mb-2">Hasil Surat:</h2>
      <textarea id="outputSurat" rows="12" class="w-full p-3 border rounded bg-gray-50 font-mono text-sm"></textarea>
      
      <div class="flex gap-2 mt-3">
        <button onclick="copyToClipboard()" class="bg-gray-800 text-white px-4 py-2 text-sm rounded">📋 Salin Teks</button>
        <button onclick="window.print()" class="bg-gray-600 text-white px-4 py-2 text-sm rounded">🖨️ Cetak / PDF</button>
      </div>
      <p class="text-xs text-yellow-600 mt-2">⚠️ *Periksa kembali isi surat sebelum digunakan resmi.</p>
    </div>
  </div>

  <script>
    // Muat kode simpanan lokal jika ada
    document.getElementById('premiumCode').value = localStorage.getItem('surat_premium_code') || '';

    function simpanKode() {
      const code = document.getElementById('premiumCode').value.trim();
      localStorage.setItem('surat_premium_code', code);
      document.getElementById('codeStatus').innerText = 'Kode disimpan di browser!';
    }

    async function generateSurat() {
      const jenisSurat = document.getElementById('jenisSurat').value;
      const detailInput = document.getElementById('detailInput').value;
      const premiumCode = localStorage.getItem('surat_premium_code') || '';
      const btn = document.getElementById('btnSubmit');

      if (!detailInput) return alert('Harap isi detail informasi surat terlebih dahulu.');

      btn.disabled = true;
      btn.innerText = 'Memproses dengan AI...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jenisSurat, detailInput, premiumCode })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        document.getElementById('outputSurat').value = data.result;
        document.getElementById('resultArea').classList.remove('hidden');
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Buat Surat Sekarang';
      }
    }

    function copyToClipboard() {
      const copyText = document.getElementById("outputSurat");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Surat berhasil disalin!");
    }
  </script>
</body>
</html>
